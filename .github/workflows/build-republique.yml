name: Build République container images
on:
  push:
    tags:
      - 'v*-republique.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-24.04
    if: github.repository == 'rialg/republique-pub'
    outputs:
      metadata: ${{ steps.version.outputs.metadata }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Compute version metadata
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version_of() {
            sed -n "/def $1\$/{n;s/[[:space:]']//g;p;q}" lib/mastodon/version.rb
          }
          version="$(version_of major).$(version_of minor).$(version_of patch)"
          prerelease="$(version_of default_prerelease)"
          if [[ -n "$prerelease" ]]; then
            version="$version-$prerelease"
          fi
          echo "Version from lib/mastodon/version.rb: $version"

          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v(.+)-(republique(\.[0-9A-Za-z-]+)+)$ ]]; then
              echo "::error::Tag $REF_NAME does not match v<version>-republique.<n>"
              exit 1
            fi
            if [[ "${BASH_REMATCH[1]}" != "$version" ]]; then
              echo "::error::Tag $REF_NAME does not match version $version from lib/mastodon/version.rb"
              exit 1
            fi
            metadata="${BASH_REMATCH[2]}"
          else
            metadata="republique.sha-${SHA::7}"
          fi

          echo "Resulting version: $version+$metadata"
          echo "metadata=$metadata" >> "$GITHUB_OUTPUT"

  build-image:
    needs: compute-version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - file_to_build: Dockerfile
            image: ghcr.io/rialg/republique-pub
          - file_to_build: streaming/Dockerfile
            image: ghcr.io/rialg/republique-pub-streaming

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file_to_build }}
          build-args: |
            MASTODON_VERSION_PRERELEASE=
            MASTODON_VERSION_METADATA=${{ needs.compute-version.outputs.metadata }}
            SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
